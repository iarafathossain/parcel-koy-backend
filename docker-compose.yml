services:
  backend:
    build:
      context: ./parcel-koy-backend
    container_name: parcel-koy-backend
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    env_file:
      - ./parcel-koy-backend/.env
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./parcel-koy-backend:/app # bind mount: live code
      - /app/node_modules # anonymous volume: keep container's packages

  frontend:
    build:
      context: ./parcel-koy-frontend
    container_name: parcel-koy-frontend
    ports:
      - "3000:3000"
    environment:
      - API_URL_INTERNAL=http://backend:5000
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:5000
      - WATCHPACK_POLLING=true
    env_file:
      - ./parcel-koy-frontend/.env
    volumes:
      - ./parcel-koy-frontend:/app # bind mount
      - /app/node_modules # anonymous volume
    depends_on:
      - backend

  db-backup:
    image: postgres:17-alpine # use the same major version as your Neon project
    container_name: parcel-koy-db-backup
    env_file:
      - ./parcel-koy-backend/.env
    volumes:
      - db_backups:/backups # named volume: persistent backups
    command: >
      sh -c 'while true; do
        pg_dump "$$DIRECT_URL" -F c -f /backups/parcelkoy_$$(date +%Y%m%d_%H%M%S).dump;
        find /backups -name "*.dump" -mtime +7 -delete;
        sleep 86400;
      done'

volumes:
  db_backups:
